name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: minion_test
          POSTGRES_USER: minion
          POSTGRES_PASSWORD: minion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minion -d minion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://minion:minion@localhost:5432/minion_test
      DB_URL: postgresql+psycopg2://minion:minion@localhost:5432/minion_test
      JWT_SECRET: test-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app models tests alembic
      - run: python -m alembic heads
      - run: python -m alembic branches
      - run: PYTHONWARNINGS=error::ResourceWarning python -m unittest discover -s tests -v
